<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - Admin | Uju Fashion Sales</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* Same admin styles as index.html */
        .admin-container { display: flex; min-height: 100vh; }
        .admin-sidebar { width: 260px; background: var(--dark); color: var(--white); padding: 30px 20px; position: fixed; height: 100vh; overflow-y: auto; }
        .admin-sidebar .logo { font-size: 24px; font-weight: 800; margin-bottom: 30px; display: block; color: var(--white); }
        .admin-sidebar .logo span { color: var(--secondary); }
        .admin-sidebar .menu-label { font-size: 12px; text-transform: uppercase; color: #666; margin: 20px 0 10px; letter-spacing: 1px; }
        .admin-sidebar a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #aaa; border-radius: 8px; transition: var(--transition); margin-bottom: 4px; }
        .admin-sidebar a:hover, .admin-sidebar a.active { background: rgba(255,255,255,0.1); color: var(--white); }
        .admin-sidebar a i { width: 20px; text-align: center; }
        .admin-sidebar .logout-btn { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .admin-main { margin-left: 260px; flex: 1; padding: 30px; background: var(--gray); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--white); padding: 20px 30px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .admin-header h1 { font-size: 24px; font-weight: 700; }
        .admin-header .admin-user { display: flex; align-items: center; gap: 12px; }
        .admin-header .admin-user img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        
        .table-container { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .table-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid #f0f0f0; }
        .table-header .btn-primary { padding: 10px 24px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px 20px; background: #f8f8fa; font-weight: 600; font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        tr:hover { background: #fafafa; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; }
        .modal-content { background: var(--white); padding: 40px; border-radius: var(--radius); max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 24px; }
        .modal-content .form-group { margin-bottom: 16px; }
        .modal-content .form-group label { display: block; font-weight: 600; margin-bottom: 4px; }
        .modal-content .form-group input, .modal-content .form-group textarea, .modal-content .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .modal-content .form-group textarea { min-height: 80px; resize: vertical; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        
        @media (max-width: 768px) { .admin-sidebar { width: 200px; } .admin-main { margin-left: 200px; padding: 20px; } }
        @media (max-width: 480px) { .admin-sidebar { width: 100%; height: auto; position: relative; } .admin-main { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <a href="index.html" class="logo">Uju<span>Fashion</span></a>
            <div class="menu-label">Main Menu</div>
            <a href="index.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="products.html" class="active"><i class="fas fa-box"></i> Products</a>
            <a href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
            <a href="customers.html"><i class="fas fa-users"></i> Customers</a>
            <div class="menu-label">Marketing</div>
            <a href="coupons.html"><i class="fas fa-ticket"></i> Coupons</a>
            <a href="banners.html"><i class="fas fa-image"></i> Banners</a>
            <div class="menu-label">Content</div>
            <a href="reviews.html"><i class="fas fa-star"></i> Reviews</a>
            <a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a>
            <div class="logout-btn"><a href="#" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
        </aside>
        
        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <h1>Product Management</h1>
                <div class="admin-user">
                    <span id="adminName">Admin</span>
                    <img src="https://ui-avatars.com/api/?name=Admin&background=2d1b69&color=fff" alt="Admin" />
                </div>
            </div>
            
            <div class="table-container">
                <div class="table-header">
                    <h3>All Products</h3>
                    <button class="btn-primary" onclick="showProductModal()">
                        <i class="fas fa-plus"></i> Add Product
                    </button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productTable"></tbody>
                </table>
            </div>
        </main>
    </div>
    
    <!-- Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Product</h2>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="productId" />
                
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="productName" required />
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="productDescription" required></textarea>
                </div>
                
                <div class="form-group">
                    <label>Category</label>
                    <select id="productCategory" required>
                        <option value="">Select Category</option>
                        <option value="Men">Men</option>
                        <option value="Women">Women</option>
                        <option value="Baggy Jeans">Baggy Jeans</option>
                        <option value="Boyfriend Jeans">Boyfriend Jeans</option>
                        <option value="Straight Jeans">Straight Jeans</option>
                        <option value="Polo Shirts">Polo Shirts</option>
                        <option value="Jerseys">Jerseys</option>
                        <option value="Shorts">Shorts</option>
                        <option value="Skirts">Skirts</option>
                        <option value="Tops">Tops</option>
                        <option value="New Arrivals">New Arrivals</option>
                        <option value="Sale">Sale</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Price (₦)</label>
                    <input type="number" id="productPrice" required min="0" step="0.01" />
                </div>
                
                <div class="form-group">
                    <label>Original Price (₦)</label>
                    <input type="number" id="productOriginalPrice" min="0" step="0.01" />
                </div>
                
                <div class="form-group">
                    <label>Stock Quantity</label>
                    <input type="number" id="productStock" required min="0" />
                </div>
                
                <div class="form-group">
                    <label>Sizes (comma separated)</label>
                    <input type="text" id="productSizes" placeholder="S, M, L, XL" />
                </div>
                
                <div class="form-group">
                    <label>Colors (comma separated)</label>
                    <input type="text" id="productColors" placeholder="Black, Blue, White" />
                </div>
                
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                        <input type="checkbox" id="productFeatured" /> Featured Product
                    </label>
                </div>
                
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                        <input type="checkbox" id="productBestSeller" /> Best Seller
                    </label>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal('productModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/admin.js"></script>
</body>
  </html>
