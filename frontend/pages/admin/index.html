<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Uju Fashion Sales</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .admin-container {
            display: flex;
            min-height: 100vh;
        }
        
        .admin-sidebar {
            width: 260px;
            background: var(--dark);
            color: var(--white);
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            left: 0;
            top: 0;
        }
        
        .admin-sidebar .logo {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 30px;
            display: block;
            color: var(--white);
        }
        
        .admin-sidebar .logo span {
            color: var(--secondary);
        }
        
        .admin-sidebar .menu-label {
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            margin: 20px 0 10px;
            letter-spacing: 1px;
        }
        
        .admin-sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #aaa;
            border-radius: 8px;
            transition: var(--transition);
            margin-bottom: 4px;
        }
        
        .admin-sidebar a:hover,
        .admin-sidebar a.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
        }
        
        .admin-sidebar a i {
            width: 20px;
            text-align: center;
        }
        
        .admin-sidebar .logout-btn {
            margin-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }
        
        .admin-main {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
            background: var(--gray);
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--white);
            padding: 20px 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        
        .admin-header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        
        .admin-header .admin-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .admin-header .admin-user img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--white);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        
        .stat-card .stat-icon {
            font-size: 32px;
            margin-bottom: 12px;
            display: inline-block;
        }
        
        .stat-card .stat-number {
            font-size: 32px;
            font-weight: 800;
            color: var(--dark);
        }
        
        .stat-card .stat-label {
            color: #888;
            font-size: 14px;
        }
        
        .stat-card .stat-change {
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
        }
        
        .stat-card .stat-change.positive {
            color: #10b981;
        }
        
        .stat-card .stat-change.negative {
            color: #ef4444;
        }
        
        .stat-card.purple .stat-icon { color: var(--primary); }
        .stat-card.blue .stat-icon { color: #3b82f6; }
        .stat-card.green .stat-icon { color: #10b981; }
        .stat-card.orange .stat-icon { color: #f59e0b; }
        .stat-card.pink .stat-icon { color: var(--secondary); }
        .stat-card.red .stat-icon { color: #ef4444; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        
        .dashboard-card {
            background: var(--white);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        
        .dashboard-card h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .recent-order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .recent-order-item:last-child {
            border-bottom: none;
        }
        
        .recent-order-item .order-info {
            display: flex;
            flex-direction: column;
        }
        
        .recent-order-item .order-info .order-id {
            font-weight: 600;
        }
        
        .recent-order-item .order-info .order-date {
            font-size: 13px;
            color: #888;
        }
        
        .recent-order-item .order-status {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .order-status.pending { background: #fef3c7; color: #d97706; }
        .order-status.accepted { background: #dbeafe; color: #2563eb; }
        .order-status.processing { background: #e0e7ff; color: #4f46e5; }
        .order-status.shipped { background: #d1fae5; color: #059669; }
        .order-status.delivered { background: #d1fae5; color: #059669; }
        .order-status.cancelled { background: #fee2e2; color: #dc2626; }
        
        .low-stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .low-stock-item .stock-bar {
            width: 120px;
            height: 6px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .low-stock-item .stock-bar .fill {
            height: 100%;
            border-radius: 10px;
        }
        
        .low-stock-item .stock-bar .fill.critical { background: #ef4444; }
        .low-stock-item .stock-bar .fill.low { background: #f59e0b; }
        .low-stock-item .stock-bar .fill.medium { background: #3b82f6; }
        
        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .admin-sidebar {
                width: 200px;
            }
            .admin-main {
                margin-left: 200px;
                padding: 20px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 480px) {
            .admin-sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .admin-main {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <a href="index.html" class="logo">Uju<span>Fashion</span></a>
            
            <div class="menu-label">Main Menu</div>
            <a href="index.html" class="active">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="products.html">
                <i class="fas fa-box"></i> Products
            </a>
            <a href="orders.html">
                <i class="fas fa-shopping-cart"></i> Orders
            </a>
            <a href="customers.html">
                <i class="fas fa-users"></i> Customers
            </a>
            
            <div class="menu-label">Marketing</div>
            <a href="coupons.html">
                <i class="fas fa-ticket"></i> Coupons
            </a>
            <a href="banners.html">
                <i class="fas fa-image"></i> Banners
            </a>
            
            <div class="menu-label">Content</div>
            <a href="reviews.html">
                <i class="fas fa-star"></i> Reviews
            </a>
            <a href="reports.html">
                <i class="fas fa-chart-bar"></i> Reports
            </a>
            
            <div class="logout-btn">
                <a href="#" onclick="logoutUser()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="admin-main">
            <!-- Header -->
            <div class="admin-header">
                <h1>Dashboard</h1>
                <div class="admin-user">
                    <span id="adminName">Admin</span>
                    <img src="https://ui-avatars.com/api/?name=Admin&background=2d1b69&color=fff" alt="Admin" />
                </div>
            </div>
            
            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <!-- Stats loaded dynamically -->
            </div>
            
            <!-- Dashboard Grid -->
            <div class="dashboard-grid">
                <!-- Recent Orders -->
                <div class="dashboard-card">
                    <h3>Recent Orders</h3>
                    <div id="recentOrders">
                        <!-- Orders loaded dynamically -->
                    </div>
                </div>
                
                <!-- Low Stock Alerts -->
                <div class="dashboard-card">
                    <h3>Low Stock Alerts</h3>
                    <div id="lowStock">
                        <!-- Stock alerts loaded dynamically -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/admin.js"></script>
</body>
  </html>
